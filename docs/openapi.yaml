openapi: 3.0.3
info:
  title: Smart Travel Planner API
  version: 1.0.0
  description: Self-developed REST API for managing authenticated user travel records.
servers:
  - url: http://localhost:3000/api/v1
security:
  - bearerAuth: []
paths:
  /health:
    get:
      security: []
      summary: Check API status
      responses:
        "200":
          description: API is healthy
  /auth/register:
    post:
      security: []
      summary: Register a traveller account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: User registered and JWT returned
        "409":
          description: Email already registered
  /auth/login:
    post:
      security: []
      summary: Login and receive a JWT
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Login successful
        "401":
          description: Invalid credentials
  /trips:
    post:
      summary: Create a trip record
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TripCreateRequest"
      responses:
        "201":
          description: Trip created
        "400":
          description: Validation failed
        "401":
          description: Missing or invalid JWT
    get:
      summary: List the authenticated user's trips
      parameters:
        - in: query
          name: status
          schema:
            type: string
            enum: [planned, visited, cancelled]
        - in: query
          name: destination
          schema:
            type: string
        - in: query
          name: limit
          schema:
            type: integer
            default: 25
        - in: query
          name: offset
          schema:
            type: integer
            default: 0
      responses:
        "200":
          description: Trips returned
        "401":
          description: Missing or invalid JWT
  /trips/{id}:
    get:
      summary: Get one trip owned by the authenticated user
      parameters:
        - $ref: "#/components/parameters/TripId"
      responses:
        "200":
          description: Trip returned
        "404":
          description: Trip not found
    put:
      summary: Update one trip owned by the authenticated user
      parameters:
        - $ref: "#/components/parameters/TripId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TripUpdateRequest"
      responses:
        "200":
          description: Trip updated
        "400":
          description: Validation failed
        "404":
          description: Trip not found
    delete:
      summary: Delete one trip owned by the authenticated user
      parameters:
        - $ref: "#/components/parameters/TripId"
      responses:
        "204":
          description: Trip deleted
        "404":
          description: Trip not found
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    TripId:
      in: path
      name: id
      required: true
      schema:
        type: integer
        minimum: 1
  schemas:
    RegisterRequest:
      type: object
      required: [name, email, password]
      properties:
        name:
          type: string
          example: Aisha Tan
        email:
          type: string
          format: email
          example: aisha@example.com
        password:
          type: string
          minLength: 8
          example: StrongPass123
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
    TripCreateRequest:
      type: object
      required: [destination, startDate]
      properties:
        destination:
          type: string
          example: Kyoto
        country:
          type: string
          example: Japan
        startDate:
          type: string
          format: date
          example: "2026-07-10"
        endDate:
          type: string
          format: date
          example: "2026-07-16"
        notes:
          type: string
          example: Prefer cultural sites and train-friendly routes.
        preferenceTags:
          type: array
          items:
            type: string
          example: [culture, food, museums]
        budgetAmount:
          type: number
          example: 2500
        status:
          type: string
          enum: [planned, visited, cancelled]
          example: planned
    TripUpdateRequest:
      type: object
      properties:
        destination:
          type: string
          example: Kyoto
        country:
          type: string
          example: Japan
        startDate:
          type: string
          format: date
          example: "2026-07-10"
        endDate:
          type: string
          format: date
          example: "2026-07-16"
        notes:
          type: string
          example: Completed trip and saved reflections.
        preferenceTags:
          type: array
          items:
            type: string
          example: [culture, food, museums]
        budgetAmount:
          type: number
          example: 2500
        status:
          type: string
          enum: [planned, visited, cancelled]
          example: visited
