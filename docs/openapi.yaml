openapi: 3.0.3
info:
  title: Smart Travel Planner API
  version: 1.0.0
  description: Self-developed REST API for managing authenticated user travel records.
servers:
  - url: http://localhost:3000/api/v1
security:
  - bearerAuth: []
paths:
  /health:
    get:
      security: []
      summary: Check API status
      responses:
        "200":
          description: API is healthy
  /auth/register:
    post:
      security: []
      summary: Register a traveller account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: User registered and JWT returned
        "409":
          description: Email already registered
  /auth/login:
    post:
      security: []
      summary: Login and receive a JWT
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Login successful
        "401":
          description: Invalid credentials
  /trips:
    post:
      summary: Create a trip record
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TripCreateRequest"
      responses:
        "201":
          description: Trip created
        "400":
          description: Validation failed
        "401":
          description: Missing or invalid JWT
    get:
      summary: List the authenticated user's trips
      parameters:
        - in: query
          name: status
          schema:
            type: string
            enum: [planned, visited, cancelled]
        - in: query
          name: destination
          schema:
            type: string
        - in: query
          name: limit
          schema:
            type: integer
            default: 25
        - in: query
          name: offset
          schema:
            type: integer
            default: 0
      responses:
        "200":
          description: Trips returned
        "401":
          description: Missing or invalid JWT
  /trips/{id}:
    get:
      summary: Get one trip owned by the authenticated user
      parameters:
        - $ref: "#/components/parameters/TripId"
      responses:
        "200":
          description: Trip returned
        "404":
          description: Trip not found
    put:
      summary: Update one trip owned by the authenticated user
      parameters:
        - $ref: "#/components/parameters/TripId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TripUpdateRequest"
      responses:
        "200":
          description: Trip updated
        "400":
          description: Validation failed
        "404":
          description: Trip not found
    delete:
      summary: Delete one trip owned by the authenticated user
      parameters:
        - $ref: "#/components/parameters/TripId"
      responses:
        "204":
          description: Trip deleted
        "404":
          description: Trip not found
  /planner/trips/{id}/summary:
    get:
      summary: Combine a saved trip with weather and nearby attractions
      description: Uses the authenticated user's trip destination, geocodes it with Open-Meteo, fetches current weather, retrieves nearby point-of-interest items from OpenStreetMap Overpass API with dynamic Nominatim and Wikimedia geosearch fallbacks, and returns a travel recommendation.
      parameters:
        - $ref: "#/components/parameters/TripId"
      responses:
        "200":
          description: Trip, current weather and attractions returned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TripWeatherResponse"
        "401":
          description: Missing or invalid JWT
        "404":
          description: Trip or destination not found
        "502":
          description: External API returned an invalid response
        "503":
          description: External API network failure
  /planner/trips/{id}/weather:
    get:
      summary: Backward-compatible alias for trip planning summary
      description: Returns the same combined response as `/planner/trips/{id}/summary`.
      parameters:
        - $ref: "#/components/parameters/TripId"
      responses:
        "200":
          description: Trip, current weather and attractions returned
  /locations/destinations:
    get:
      security: []
      summary: Search destination suggestions for the application form
      description: Uses Open-Meteo geocoding and optionally filters results by selected country.
      parameters:
        - in: query
          name: name
          required: true
          schema:
            type: string
          example: Pen
        - in: query
          name: country
          required: false
          schema:
            type: string
          example: Malaysia
      responses:
        "200":
          description: Destination suggestions returned
  /locations/states:
    get:
      security: []
      summary: List states or regions for a selected country
      parameters:
        - in: query
          name: country
          required: true
          schema:
            type: string
          example: Malaysia
      responses:
        "200":
          description: States or regions returned
  /locations/cities:
    get:
      security: []
      summary: List cities for a selected country and optional state
      parameters:
        - in: query
          name: country
          required: true
          schema:
            type: string
          example: Malaysia
        - in: query
          name: state
          required: false
          schema:
            type: string
          example: Penang
      responses:
        "200":
          description: Cities returned
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    TripId:
      in: path
      name: id
      required: true
      schema:
        type: integer
        minimum: 1
  schemas:
    RegisterRequest:
      type: object
      required: [name, email, password]
      properties:
        name:
          type: string
          example: Aisha Tan
        email:
          type: string
          format: email
          example: aisha@example.com
        password:
          type: string
          minLength: 8
          example: StrongPass123
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
    TripCreateRequest:
      type: object
      required: [destination, startDate]
      properties:
        destination:
          type: string
          example: Kyoto
        country:
          type: string
          example: Japan
        region:
          type: string
          example: Kansai
        startDate:
          type: string
          format: date
          example: "2026-07-10"
        endDate:
          type: string
          format: date
          example: "2026-07-16"
        notes:
          type: string
          example: Prefer cultural sites and train-friendly routes.
        preferenceTags:
          type: array
          items:
            type: string
          example: [culture, food, museums]
        budgetAmount:
          type: number
          example: 2500
        budgetCurrency:
          type: string
          example: JPY
        status:
          type: string
          enum: [planned, visited, cancelled]
          example: planned
    TripUpdateRequest:
      type: object
      properties:
        destination:
          type: string
          example: Kyoto
        country:
          type: string
          example: Japan
        region:
          type: string
          example: Kansai
        startDate:
          type: string
          format: date
          example: "2026-07-10"
        endDate:
          type: string
          format: date
          example: "2026-07-16"
        notes:
          type: string
          example: Completed trip and saved reflections.
        preferenceTags:
          type: array
          items:
            type: string
          example: [culture, food, museums]
        budgetAmount:
          type: number
          example: 2500
        budgetCurrency:
          type: string
          example: JPY
        status:
          type: string
          enum: [planned, visited, cancelled]
          example: visited
    TripWeatherResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object
          properties:
            trip:
              type: object
            externalData:
              type: object
              properties:
                weather:
                  type: object
                  properties:
                    provider:
                      type: string
                      example: Open-Meteo
                    location:
                      type: object
                      properties:
                        name:
                          type: string
                          example: Kyoto
                        country:
                          type: string
                          example: Japan
                        latitude:
                          type: number
                          example: 35.0211
                        longitude:
                          type: number
                          example: 135.7538
                    currentWeather:
                      type: object
                      properties:
                        temperatureCelsius:
                          type: number
                          example: 28.1
                        humidityPercent:
                          type: number
                          example: 72
                        windSpeedKmh:
                          type: number
                          example: 9.4
                        description:
                          type: string
                          example: Partly cloudy
                attractions:
                  type: object
                  properties:
                    provider:
                      type: string
                      example: OpenStreetMap Overpass API
                    searchRadiusMeters:
                      type: integer
                      example: 10000
                    attractions:
                      type: array
                      items:
                        type: object
                        properties:
                          name:
                            type: string
                            example: Kyoto National Museum
                          category:
                            type: string
                            example: point_of_interest
                          url:
                            type: string
                            example: https://en.wikipedia.org/?curid=12345
            recommendation:
              type: object
              properties:
                destination:
                  type: string
                  example: Kyoto
                summary:
                  type: string
                  example: Weather conditions look suitable for general sightseeing.
            travelPlan:
              type: object
              properties:
                title:
                  type: string
                  example: Kyoto travel plan
                itinerary:
                  type: array
                  items:
                    type: object
                    properties:
                      day:
                        type: integer
                        example: 1
                      date:
                        type: string
                        format: date
                        example: "2026-07-10"
                      theme:
                        type: string
                        example: Food and local neighbourhoods
                      location:
                        type: string
                        example: Nishiki Market
                      locationCategory:
                        type: string
                        example: marketplace
                      locationUrl:
                        type: string
                        example: https://www.openstreetmap.org/node/703170
                      bestTime:
                        type: string
                        example: Late afternoon or evening.
                      morning:
                        type: string
                        example: Make Nishiki Market the main stop for this day.
                      afternoon:
                        type: string
                        example: Continue to a nearby cafe and keep transit time flexible.
                      evening:
                        type: string
                        example: Leave the evening open for dinner, cafes or a local food street.
