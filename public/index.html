<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Smart Travel Planner</title>
    <link rel="stylesheet" href="/app/styles.css">
  </head>
  <body>
    <header class="topbar">
      <div>
        <h1>Smart Travel Planner</h1>
        <p id="sessionStatus">Signed out</p>
      </div>
      <nav>
        <a href="/api-docs">API Docs</a>
        <button id="logoutButton" type="button">Sign out</button>
      </nav>
    </header>

    <main class="layout">
      <section class="panel auth-panel" aria-labelledby="authTitle">
        <div class="panel-heading">
          <h2 id="authTitle">Account</h2>
          <div class="segmented">
            <button id="loginTab" class="active" type="button">Login</button>
            <button id="registerTab" type="button">Register</button>
          </div>
        </div>

        <form id="authForm" class="stack">
          <label id="nameField">
            Name
            <input id="nameInput" autocomplete="name" placeholder="Test Student">
          </label>
          <label>
            Email
            <input id="emailInput" type="email" autocomplete="email" value="teststudent@example.com">
          </label>
          <label>
            Password
            <input id="passwordInput" type="password" autocomplete="current-password" value="Password123">
          </label>
          <button class="primary" type="submit">Continue</button>
        </form>
      </section>

      <section class="panel trip-form-panel" aria-labelledby="tripFormTitle">
        <div class="panel-heading">
          <h2 id="tripFormTitle">Plan a Trip</h2>
          <button id="resetTripFormButton" type="button">New</button>
        </div>

        <form id="tripForm" class="trip-grid">
          <input id="tripIdInput" type="hidden">
          <label>
            Country
            <input id="countryInput" list="countryOptions" placeholder="Malaysia">
            <datalist id="countryOptions"></datalist>
          </label>
          <label>
            Destination
            <input id="destinationInput" required list="destinationOptions" placeholder="Pick a country first">
            <datalist id="destinationOptions"></datalist>
          </label>
          <label>
            Start date
            <input id="startDateInput" required type="date">
          </label>
          <label>
            End date
            <input id="endDateInput" type="date">
          </label>
          <label>
            Budget
            <input id="budgetInput" type="number" min="1" step="1" placeholder="1200">
          </label>
          <label>
            Status
            <select id="statusInput">
              <option value="planned">Planned</option>
              <option value="visited">Visited</option>
              <option value="cancelled">Cancelled</option>
            </select>
          </label>
          <fieldset class="wide preference-field">
            <legend>Preferences</legend>
            <div class="preference-grid">
              <label><input type="checkbox" name="preference" value="food" checked> Food</label>
              <label><input type="checkbox" name="preference" value="culture" checked> Culture</label>
              <label><input type="checkbox" name="preference" value="beach" checked> Beach</label>
              <label><input type="checkbox" name="preference" value="museums"> Museums</label>
              <label><input type="checkbox" name="preference" value="shopping"> Shopping</label>
              <label><input type="checkbox" name="preference" value="nature"> Nature</label>
              <label><input type="checkbox" name="preference" value="nightlife"> Nightlife</label>
              <label><input type="checkbox" name="preference" value="family"> Family</label>
            </div>
          </fieldset>
          <label class="wide manual-preferences">
            Preferences
            <input id="tagsInput" placeholder="food, culture, beach">
          </label>
          <label class="wide">
            Notes
            <textarea id="notesInput" rows="4" placeholder="Food hunting and sightseeing"></textarea>
          </label>
          <button class="primary wide" type="submit">Save travel plan</button>
        </form>
      </section>

      <section class="panel list-panel" aria-labelledby="tripListTitle">
        <div class="panel-heading">
          <h2 id="tripListTitle">Trips</h2>
          <button id="refreshTripsButton" type="button">Refresh</button>
        </div>
        <div id="tripList" class="trip-list"></div>
      </section>

      <section class="panel summary-panel" aria-labelledby="summaryTitle">
        <div class="panel-heading">
          <h2 id="summaryTitle">Generated Travel Plan</h2>
        </div>
        <div id="summaryContent" class="summary-empty">Select a saved trip and generate a travel plan.</div>
      </section>
    </main>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>
    <script src="/app/app.js"></script>
  </body>
</html>
